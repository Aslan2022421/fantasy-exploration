<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>畫法比較</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #06181a;
        color: #a8c3bd;
        font-family: sans-serif;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }
      button {
        background: #143a3d;
        color: #a8c3bd;
        border: 1px solid #3f7377;
        padding: 4px 12px;
        cursor: pointer;
      }
      #grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 4px;
        color: #c9bb7a;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        border: 1px solid #2b5558;
      }
    </style>
  </head>
  <body>
    <header>
      <button type="button" id="prev">上一個地點</button>
      <button type="button" id="next">下一個地點</button>
      <span id="where"></span>
    </header>
    <div id="grid"></div>
    <script type="module" src="/src/dev/compare.js"></script>
  </body>
</html>
