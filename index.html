<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fantasy Exploration</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d2a2c;
      }
      #stage canvas {
        position: absolute;
        image-rendering: pixelated;
      }
      #overlay {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <canvas id="overlay"></canvas>
    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>
